name: Pull Request Merge Gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"
  COVERAGE_FAIL_UNDER: "99"

jobs:
  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-security:
    name: PR Merge Gate / Lint Typecheck Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Verify Dependencies
        run: make verify-dependencies
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: Evaluation Manifest Gate
        run: make eval-manifest-gate
      - name: Evaluation Run Gate
        run: make eval-run-gate
      - name: Async Job Gate
        run: make async-job-gate
      - name: Branch Protection Policy Gate (offline shape)
        run: make branch-protection-policy-gate
      - name: Migration Smoke
        env:
          LOTUS_AI_DATABASE_URL: "sqlite:///:memory:"
        run: make migration-smoke
      - name: Security Audit
        run: make security-audit
      - name: Dependency Lock Replay
        run: make dependency-lock-replay-check
      - name: RFC-0002 Idea Proof Gate
        run: make rfc0002-idea-proof-gate

  test-suites:
    name: PR Merge Gate / Tests (${{ matrix.suite }})
    needs: [lint-typecheck-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
          - suite: integration
            path: tests/integration
          - suite: e2e
            path: tests/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Run tests with coverage data
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: |
          if [ "${{ matrix.suite }}" = "integration" ]; then
            python scripts/run_integration_coverage.py
          else
            python -m pytest ${{ matrix.path }} --cov=src --cov-report=
          fi
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error

  runtime-mode-smoke:
    name: PR Merge Gate / Runtime Mode Smoke
    needs: [lint-typecheck-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Verify SQL-backed runtime modes
        run: make runtime-mode-smoke

  postgres-fence-proof:
    name: PR Merge Gate / PostgreSQL Fence Proof
    needs: [lint-typecheck-security]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lotus_ai
          POSTGRES_USER: lotus_ai
          POSTGRES_PASSWORD: lotus_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lotus_ai -d lotus_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Prove CAS fences on PostgreSQL
        env:
          LOTUS_AI_POSTGRES_TEST_URL: postgresql+psycopg://lotus_ai:lotus_ai@localhost:5432/lotus_ai
          LOTUS_AI_POSTGRES_TEST_REQUIRED: "1"
        run: make test-postgres

  coverage-gate:
    name: PR Merge Gate / Coverage Gate (Combined)
    needs: [test-suites, runtime-mode-smoke, postgres-fence-proof]
    # Runs even when a dependency failed, so a failed upstream gate becomes a
    # FAILED required check here rather than a skipped one. A skipped required
    # check blocks the merge button but reports as absent, not as a failure -
    # which reads like "not applicable" instead of "this gate said no".
    if: always()
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - name: Require every upstream gate to have succeeded
        run: |
          FAILED=""
          [ "${{ needs.test-suites.result }}" = "success" ] || FAILED="$FAILED test-suites(${{ needs.test-suites.result }})"
          [ "${{ needs.runtime-mode-smoke.result }}" = "success" ] || FAILED="$FAILED runtime-mode-smoke(${{ needs.runtime-mode-smoke.result }})"
          [ "${{ needs.postgres-fence-proof.result }}" = "success" ] || FAILED="$FAILED postgres-fence-proof(${{ needs.postgres-fence-proof.result }})"
          if [ -n "$FAILED" ]; then
            echo "Upstream gate(s) did not succeed:$FAILED" >&2
            exit 1
          fi
          echo "All upstream gates succeeded."
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data
      - name: Enforce coverage floor
        run: |
          python -m coverage combine coverage-data
          python -m coverage report --fail-under=${{ env.COVERAGE_FAIL_UNDER }}

  docker-build:
    name: PR Merge Gate / Validate Docker Build
    needs: [coverage-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: make docker-build
