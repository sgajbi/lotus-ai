name: Main Gate Coverage Audit

on:
  schedule:
    # Daily: proves every commit on main carries a verdict-bearing gate run.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many recent main commits to audit"
        required: false
        default: "50"

permissions:
  actions: read
  contents: read

jobs:
  audit-main-gate-coverage:
    name: Audit Main Gate Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Audit main gate coverage
        env:
          GH_TOKEN: ${{ github.token }}
        # `--fail-on-gap` only. Coverage is what this gate enforces: a commit
        # with no terminal verdict is a dispatch defect and is actionable now.
        #
        # Failed verdicts are REPORTED, with each commit named, but do not fail
        # the step. They are recorded history under #373 - the tree at those
        # commits genuinely does not pass, so re-running reproduces the failure
        # and no action clears them. Failing on them would make this a gate
        # that cannot pass, which is how a control stops being read. Pass
        # --fail-on-failed-verdict deliberately when auditing a window that is
        # expected to be clean.
        #
        # Bounded recheck so a gate mid-flight is not reported as a gap, and an
        # explicit age limit so one that never concludes ages into STALE rather
        # than holding the audit open until it looks like evidence.
        run: |
          python scripts/audit_main_gate_coverage.py \
            --limit "${{ github.event.inputs.limit || '50' }}" \
            --pending-max-age-minutes 90 \
            --recheck-attempts 3 \
            --recheck-delay-seconds 20 \
            --fail-on-gap
      - name: Enforce Branch Protection Policy
        # Runs even when the audit above failed: two independent delivery
        # controls, and a skipped check reads as absent rather than as a
        # refusal.
        if: ${{ !cancelled() }}
        env:
          # github.token cannot carry administration:read, which the branch
          # protection endpoint requires; a repository PAT can. A missing or
          # unauthorized token FAILS this step rather than passing it
          # silently - a silent pass without the token is exactly the
          # gate-liveness defect this control exists to prevent. No Lotus
          # repository holds an Actions secret as of 2026-09-06, so this
          # step fails closed until an operator provisions one (issue #358).
          GH_TOKEN: ${{ secrets.LOTUS_AUTOMERGE_TOKEN }}
        # Invoked BARE: piping through tee would report tee's exit status and
        # leave the checker able to raise beneath a green check.
        run: python scripts/check_branch_protection_policy.py
