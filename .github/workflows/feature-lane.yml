name: Remote Feature Lane

on:
  push:
    branches-ignore: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"

jobs:
  workflow-lint:
    name: Feature Lane / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-governance:
    name: Feature Lane / Lint Typecheck Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Verify Dependencies
        run: make verify-dependencies
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: Evaluation Manifest Gate
        run: make eval-manifest-gate
      - name: Evaluation Run Gate
        run: make eval-run-gate
      - name: Async Job Gate
        run: make async-job-gate
      - name: Migration Smoke
        env:
          LOTUS_AI_DATABASE_URL: "sqlite:///:memory:"
        run: make migration-smoke
      - name: Security Audit
        run: make security-audit
      - name: Dependency Lock Replay
        run: make dependency-lock-replay-check

  unit-tests:
    name: Feature Lane / Tests (unit)
    needs: [lint-typecheck-governance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Run unit tests
        run: make test-unit
