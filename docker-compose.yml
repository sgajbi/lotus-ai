services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lotus_ai
      POSTGRES_USER: lotus
      POSTGRES_PASSWORD: lotus
    volumes:
      - lotus-ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotus -d lotus_ai"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  lotus-ai:
    build: .
    command: ["./scripts/docker/start-api.sh"]
    ports:
      - "8140:8140"
    env_file:
      - ${LOTUS_AI_ENV_FILE:-.env}
    environment:
      LOTUS_AI_AUDIT_STORE_MODE: sqlalchemy
      LOTUS_AI_PROMPT_STORE_MODE: sqlalchemy
      LOTUS_AI_RETRIEVAL_STORE_MODE: sqlalchemy
      LOTUS_AI_ACCESS_CONTROL_STORE_MODE: sqlalchemy
      LOTUS_AI_PROVIDER_OPERATIONS_STORE_MODE: sqlalchemy
      LOTUS_AI_ASYNC_CUTOVER_STATE: dedicated_workers_active
      LOTUS_AI_ASYNC_QUEUE_BACKEND_MODE: redis
      LOTUS_AI_ASYNC_QUEUE_REDIS_URL: redis://redis:6379/0
      LOTUS_AI_ASYNC_RUNTIME_STORE_MODE: sqlalchemy
      LOTUS_AI_EVALUATION_RUNTIME_STORE_MODE: sqlalchemy
      LOTUS_AI_ARTIFACT_STORE_MODE: sqlalchemy
      LOTUS_AI_ARTIFACT_OBJECT_STORE_MODE: filesystem
      LOTUS_AI_ARTIFACT_OBJECT_STORE_ROOT: /data/object-store
      LOTUS_AI_SECRET_SOURCE_MODE: local_or_unspecified
      LOTUS_AI_DATABASE_URL: ${LOTUS_AI_DATABASE_URL:-postgresql+psycopg://lotus:lotus@postgres:5432/lotus_ai}
    volumes:
      - lotus-ai-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8140/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 10

  lotus-ai-worker:
    build: .
    command: ["./scripts/docker/start-worker.sh"]
    env_file:
      - ${LOTUS_AI_ENV_FILE:-.env}
    environment:
      LOTUS_AI_AUDIT_STORE_MODE: sqlalchemy
      LOTUS_AI_PROMPT_STORE_MODE: sqlalchemy
      LOTUS_AI_RETRIEVAL_STORE_MODE: sqlalchemy
      LOTUS_AI_ACCESS_CONTROL_STORE_MODE: sqlalchemy
      LOTUS_AI_PROVIDER_OPERATIONS_STORE_MODE: sqlalchemy
      LOTUS_AI_ASYNC_CUTOVER_STATE: dedicated_workers_active
      LOTUS_AI_ASYNC_QUEUE_BACKEND_MODE: redis
      LOTUS_AI_ASYNC_QUEUE_REDIS_URL: redis://redis:6379/0
      LOTUS_AI_ASYNC_RUNTIME_STORE_MODE: sqlalchemy
      LOTUS_AI_EVALUATION_RUNTIME_STORE_MODE: sqlalchemy
      LOTUS_AI_ARTIFACT_STORE_MODE: sqlalchemy
      LOTUS_AI_ARTIFACT_OBJECT_STORE_MODE: filesystem
      LOTUS_AI_ARTIFACT_OBJECT_STORE_ROOT: /data/object-store
      LOTUS_AI_SECRET_SOURCE_MODE: local_or_unspecified
      LOTUS_AI_DATABASE_URL: ${LOTUS_AI_DATABASE_URL:-postgresql+psycopg://lotus:lotus@postgres:5432/lotus_ai}
      LOTUS_AI_ASYNC_WORKER_ID: lotus-ai-worker-1
    volumes:
      - lotus-ai-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      lotus-ai:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - lotus-ai-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 15

volumes:
  lotus-ai-data:
  lotus-ai-postgres-data:
  lotus-ai-ollama-data:
