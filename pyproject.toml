[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotus-ai"
version = "0.1.0"
description = "Shared AI platform service for Lotus applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "cryptography>=46.0.0",
  "fastapi>=0.133.0",
  "jsonschema>=4.25",
  "psycopg[binary]>=3.2.10",
  "uvicorn>=0.41.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.13.0",
  # Unpinned above 7.1: pinning <8 forces starlette<1.0 with known CVEs;
  # main.py's private _get_route_name patch is written signature-tolerant
  # across 7.x/8.x (see its comment) and the full suite exercises it.
  "prometheus-fastapi-instrumentator>=7.1.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.44"
]

[project.optional-dependencies]
dev = [
  "ruff==0.15.7",
  "mypy>=1.19.0",
  "types-jsonschema>=4.25",
  "pytest>=9.0.0",
  "pytest-mock>=3.15.1",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "httpx>=0.28.0",
  "coverage>=7.13.0",
  "pip-audit>=2.10.0",
  "uv>=0.9.28"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
